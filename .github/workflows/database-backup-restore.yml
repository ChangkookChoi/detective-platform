name: Verify production database backup restore

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful Production database backup workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-restore-verification
  cancel-in-progress: false

jobs:
  restore:
    name: Restore encrypted backup to isolated PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: detective_platform_restore
          POSTGRES_PASSWORD: restore-verification-only
          POSTGRES_USER: postgres
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d detective_platform_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BACKUP_DECRYPTION_IDENTITY: ${{ secrets.DATABASE_BACKUP_AGE_IDENTITY }}
      RESTORE_DATABASE_URL: postgresql://postgres:restore-verification-only@127.0.0.1:55435/detective_platform_restore
      POSTGRES_CLIENT_MODE: docker
      POSTGRES_CLIENT_IMAGE: postgres:17-alpine
      POSTGRES_DOCKER_NETWORK: host
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download encrypted backup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: detective-platform-postgres-*
          path: ${{ runner.temp }}/downloaded-backup
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}

      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age

      - name: Prepare restore inputs
        id: restore-inputs
        shell: bash
        env:
          BACKUP_DIR: ${{ runner.temp }}/downloaded-backup
          IDENTITY_FILE: ${{ runner.temp }}/database-backup-age-identity.txt
        run: |
          set -euo pipefail
          [[ -n "$BACKUP_DECRYPTION_IDENTITY" ]] || {
            echo "DATABASE_BACKUP_AGE_IDENTITY is not configured." >&2
            exit 1
          }

          mapfile -t archives < <(find "$BACKUP_DIR" -type f -name '*.dump.age' -print)
          [[ "${#archives[@]}" == "1" ]] || {
            echo "Expected exactly one encrypted backup archive." >&2
            exit 1
          }

          archive="${archives[0]}"
          checksum="$archive.sha256"
          metadata="$archive.json"
          [[ -f "$checksum" && -f "$metadata" ]] || {
            echo "Backup checksum or metadata is missing." >&2
            exit 1
          }

          printf '%s\n' "$BACKUP_DECRYPTION_IDENTITY" >"$IDENTITY_FILE"
          chmod 600 "$IDENTITY_FILE"

          {
            printf 'archive=%s\n' "$archive"
            printf 'checksum=%s\n' "$checksum"
            printf 'identity=%s\n' "$IDENTITY_FILE"
            printf 'metadata=%s\n' "$metadata"
          } >>"$GITHUB_OUTPUT"

      - name: Verify recovery point age
        shell: bash
        env:
          BACKUP_METADATA: ${{ steps.restore-inputs.outputs.metadata }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const metadata = JSON.parse(
            fs.readFileSync(process.env.BACKUP_METADATA, "utf8"),
          );
          const createdAt = Date.parse(metadata.createdAt);

          if (!Number.isFinite(createdAt)) {
            throw new Error("Backup metadata has an invalid createdAt value.");
          }

          const ageHours = (Date.now() - createdAt) / 3_600_000;
          if (ageHours < 0 || ageHours > 24) {
            throw new Error("Selected backup is outside the 24-hour RPO.");
          }

          console.log(`Selected backup age: ${ageHours.toFixed(2)} hours.`);
          NODE

      - name: Restore to empty isolated database
        id: restore
        shell: bash
        env:
          BACKUP_ARCHIVE: ${{ steps.restore-inputs.outputs.archive }}
          BACKUP_SHA256_FILE: ${{ steps.restore-inputs.outputs.checksum }}
          BACKUP_DECRYPTION_IDENTITY_FILE: ${{ steps.restore-inputs.outputs.identity }}
        run: ./scripts/restore-encrypted-postgres-backup.sh

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Verify restored schema and seed
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
        run: npm --prefix apps/web run db:verify

      - name: Record restore summary
        shell: bash
        run: |
          {
            echo "## PostgreSQL restore verification"
            echo "- Source workflow run: \`${{ inputs.backup_run_id }}\`"
            echo "- Recovery point: within 24 hours"
            echo "- Target: empty isolated PostgreSQL 17"
            echo "- Schema, migrations, constraints, and seed: verified"
          } >>"$GITHUB_STEP_SUMMARY"
